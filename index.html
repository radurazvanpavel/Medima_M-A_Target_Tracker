function b(){return Uint8Array.from(atob(PAYLOAD),function(c){return c.charCodeAt(0);});}
async function unlock(){
  var pw=document.getElementById('pw').value;
  var err=document.getElementById('err'),btn=document.getElementById('go');
  if(!pw)return;
  err.textContent='';btn.disabled=true;btn.textContent=GT[GL].wait;
  try{
    var raw=b(),salt=raw.slice(0,16),iv=raw.slice(16,28),data=raw.slice(28);
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(e){
    err.textContent=GT[GL].err;
    btn.disabled=false;btn.textContent=GT[GL].go;
    document.getElementById('pw').select();
  }
}
var GT={
  ro:{t2:'Tracker Targete M&A',s:'Document intern \u00b7 confiden\u021bial',pw:'Parol\u0103',go:'Deschide',wait:'Se deschide\u2026',err:'Parol\u0103 incorect\u0103',foot:'Medima Group \u00b7 acces restric\u021bionat'},

};
var GL='en';
function gapply(l){
  GL=l;var d=GT[l];
  document.documentElement.lang=l;
  document.getElementById('gt2').textContent=d.t2;
  document.getElementById('gs').textContent=d.s;
  document.getElementById('pw').placeholder=d.pw;
  var b=document.getElementById('go');
  if(!b.disabled)b.textContent=d.go;
  document.getElementById('gfoot').textContent=d.foot;
  var e=document.getElementById('err');
  if(e.textContent)e.textContent=d.err;
}
/* ecranul de parolă e mereu în engleză; limba se schimbă din instrument, după deschidere */
